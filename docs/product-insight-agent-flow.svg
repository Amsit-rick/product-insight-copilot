<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1110" viewBox="0 0 1400 1110" role="img" aria-labelledby="title desc">
  <title id="title">Product Insight Copilot 售后工单业务流程</title>
  <desc id="desc">客户提交售后问题后，系统识别问题和风险，核验订单事实与适用政策，由规则确定动作金额和审批要求，生成回复并独立质检。普通问题直接交付，高风险进入人工审批，证据或回复有问题时补查或修订后重新质检。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity=".09"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#526174"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
  </defs>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#dbe3ee;stroke-width:1.5}.title{fill:#10213a;font:700 28px Inter,"Segoe UI","Microsoft YaHei",sans-serif}.subtitle{fill:#526174;font:500 15px Inter,"Segoe UI","Microsoft YaHei",sans-serif}.stage{fill:#fff;stroke:#a9b6c8;stroke-width:1.5}.agent{fill:#eff6ff;stroke:#3b82f6;stroke-width:2}.evidence{fill:#ecfeff;stroke:#0891b2;stroke-width:2}.rule{fill:#fff7ed;stroke:#f59e0b;stroke-width:2}.review{fill:#fff1f2;stroke:#f43f5e;stroke-width:2}.output{fill:#f0fdf4;stroke:#22c55e;stroke-width:2}.node-title{fill:#142033;font:700 20px Inter,"Segoe UI","Microsoft YaHei",sans-serif;text-anchor:middle}.node-sub{fill:#526174;font:500 14px Inter,"Segoe UI","Microsoft YaHei",sans-serif;text-anchor:middle}.mini-title{fill:#142033;font:700 16px Inter,"Segoe UI","Microsoft YaHei",sans-serif;text-anchor:middle}.mini-sub{fill:#526174;font:500 12px Inter,"Segoe UI","Microsoft YaHei",sans-serif;text-anchor:middle}.number{fill:#1d4ed8;font:700 14px Inter,"Segoe UI",sans-serif;text-anchor:middle;dominant-baseline:middle}.number-bg{fill:#dbeafe}.tag{fill:#fff;stroke:#cbd5e1;stroke-width:1}.tag-text{fill:#526174;font:600 11px Inter,"Segoe UI","Microsoft YaHei",sans-serif;text-anchor:middle}.edge{fill:none;stroke:#526174;stroke-width:2.5;marker-end:url(#arrow)}.loop{fill:none;stroke:#2563eb;stroke-width:2.5;stroke-dasharray:7 7;marker-end:url(#arrowBlue)}.edge-label{fill:#526174;font:600 12px Inter,"Segoe UI","Microsoft YaHei",sans-serif;text-anchor:middle}.label-bg{fill:#f7f9fc}.foundation{fill:#eef2f7;stroke:#94a3b8;stroke-width:1.3}.foundation-text{fill:#475569;font:600 13px Inter,"Segoe UI","Microsoft YaHei",sans-serif;text-anchor:middle}
  </style>
  <rect class="canvas" width="1400" height="1110" rx="24"/><rect class="frame" x="24" y="24" width="1352" height="1062" rx="22"/>
  <text class="title" x="72" y="72">核心业务流程：一张售后工单如何被安全处理</text><text class="subtitle" x="72" y="104">主路径从上到下；只有质检发现问题时才回到补查或修订，高风险动作才进入人工审批。</text>
  <g filter="url(#shadow)"><rect class="stage" x="500" y="132" width="400" height="82" rx="16"/><circle class="number-bg" cx="535" cy="173" r="18"/><text class="number" x="535" y="174">1</text><text class="node-title" x="700" y="165">客户提交售后问题</text><text class="node-sub" x="700" y="190">问题描述 · 订单号 · 图片或补充材料</text></g><path class="edge" d="M700 214 V238"/>
  <g filter="url(#shadow)"><rect class="agent" x="500" y="246" width="400" height="94" rx="16"/><circle class="number-bg" cx="535" cy="293" r="18"/><text class="number" x="535" y="294">2</text><text class="node-title" x="700" y="281">识别问题与处理风险</text><text class="node-sub" x="700" y="308">判断问题类型、紧急度以及缺失信息</text><rect class="tag" x="798" y="260" width="84" height="22" rx="11"/><text class="tag-text" x="840" y="275">Triage Agent</text></g><path class="edge" d="M700 340 V364"/>
  <g filter="url(#shadow)"><rect class="evidence" x="350" y="372" width="700" height="172" rx="18"/><circle class="number-bg" cx="385" cy="413" r="18"/><text class="number" x="385" y="414">3</text><text class="node-title" x="700" y="410">核验事实与适用规则</text><text class="node-sub" x="700" y="435">高风险场景并行核验，普通场景按顺序核验</text><rect x="392" y="458" width="286" height="62" rx="12" fill="#fff" stroke="#67c5d3" stroke-width="1.4"/><text class="mini-title" x="535" y="483">订单事实</text><text class="mini-sub" x="535" y="505">订单 · 支付 · 物流 · 历史售后</text><rect x="722" y="458" width="286" height="62" rx="12" fill="#fff" stroke="#67c5d3" stroke-width="1.4"/><text class="mini-title" x="865" y="483">政策知识</text><text class="mini-sub" x="865" y="505">生效版本 · 适用条件 · 引用来源</text></g><path class="edge" d="M700 544 V568"/>
  <g filter="url(#shadow)"><rect class="rule" x="500" y="576" width="400" height="98" rx="16"/><circle cx="535" cy="625" r="18" fill="#ffedd5"/><text x="535" y="626" class="number" style="fill:#c2410c">4</text><text class="node-title" x="700" y="612">规则确定处理边界</text><text class="node-sub" x="700" y="639">动作 · 金额 · 风险等级 · 是否需要审批</text><text class="node-sub" x="700" y="659">这些字段由代码决定，模型不能覆盖</text></g><path class="edge" d="M700 674 V698"/>
  <g filter="url(#shadow)"><rect class="agent" x="500" y="706" width="400" height="88" rx="16"/><circle class="number-bg" cx="535" cy="750" r="18"/><text class="number" x="535" y="751">5</text><text class="node-title" x="700" y="742">生成客服回复草稿</text><text class="node-sub" x="700" y="770">解释已核实事实、处理方案与客户下一步</text></g><path class="edge" d="M700 794 V818"/>
  <g filter="url(#shadow)"><rect class="review" x="500" y="826" width="400" height="92" rx="16"/><circle cx="535" cy="872" r="18" fill="#ffe4e6"/><text x="535" y="873" class="number" style="fill:#be123c">6</text><text class="node-title" x="700" y="860">独立质量复核</text><text class="node-sub" x="700" y="888">检查证据、金额、承诺、引用和审批状态</text></g>
  <g filter="url(#shadow)"><rect class="stage" x="90" y="834" width="300" height="76" rx="15"/><text class="mini-title" x="240" y="864">补查证据或修订回复</text><text class="mini-sub" x="240" y="889">只处理质检指出的问题，再重新复核</text></g><path class="loop" d="M500 872 H402"/><rect class="label-bg" x="417" y="842" width="68" height="22" rx="5"/><text class="edge-label" x="451" y="857">有问题</text><path class="loop" d="M240 834 V458 H338"/>
  <g filter="url(#shadow)"><rect class="rule" x="1010" y="834" width="300" height="76" rx="15"/><text class="mini-title" x="1160" y="864">主管或风控审批</text><text class="mini-sub" x="1160" y="889">仅退款、补偿等高风险动作需要</text></g><path class="edge" d="M900 872 H998"/><rect class="label-bg" x="913" y="842" width="72" height="22" rx="5"/><text class="edge-label" x="949" y="857">高风险</text>
  <g filter="url(#shadow)"><rect class="output" x="520" y="972" width="360" height="58" rx="15"/><text class="mini-title" x="700" y="1007">回复交付 · 跟进计划 · 审计留痕</text></g><path class="edge" d="M700 918 V964"/><path class="edge" d="M1160 910 V1001 H892"/><rect class="label-bg" x="716" y="928" width="90" height="22" rx="5"/><text class="edge-label" x="761" y="943">通过 / 低风险</text>
  <rect class="foundation" x="90" y="1050" width="1220" height="34" rx="17"/><text class="foundation-text" x="700" y="1072">底层支撑：状态恢复 · 全链路追踪 · 证据记录 · 成本记录</text>
</svg>
