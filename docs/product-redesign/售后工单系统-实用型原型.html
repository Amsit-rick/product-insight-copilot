<html lang="zh-CN">
<head>

  <title>售后工作台 · 实用型改造原型</title>
  <style>
    :root{--bg:#f5f6f4;--paper:#fff;--ink:#18211d;--muted:#66716b;--line:#dfe4e0;--green:#146b50;--green2:#e6f2ed;--amber:#a75c12;--amber2:#fff2df;--red:#a73939;--red2:#fae9e9;--blue:#356d91;--blue2:#eaf2f7;--shadow:0 16px 50px #17231d14}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 "Segoe UI","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    .demo{height:30px;background:#fff6d8;color:#765500;text-align:center;padding:5px 12px;font-size:12px;border-bottom:1px solid #efdda2}.top{height:58px;background:#173d31;color:#fff;display:flex;align-items:center;padding:0 22px;gap:24px}.brand{font-size:17px;font-weight:750}.brand small{font-size:11px;font-weight:400;opacity:.7;margin-left:9px}.role-switch{display:flex;gap:4px;background:#ffffff18;padding:4px;border-radius:7px}.role-switch button{border:0;background:transparent;color:#d9e7e1;padding:6px 10px;border-radius:5px}.role-switch button.active{background:#fff;color:#173d31;font-weight:700}.top-right{margin-left:auto;display:flex;align-items:center;gap:14px;color:#d6e5df}.avatar{width:31px;height:31px;border-radius:50%;background:#dfece7;color:#173d31;display:grid;place-items:center;font-weight:800}
    .shell{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100vh - 88px)}.side{background:#fff;border-right:1px solid var(--line);padding:20px 12px}.side-title{margin:8px 12px;color:#8a938e;font-size:11px;font-weight:700}.nav-item{border:0;background:none;width:100%;text-align:left;padding:10px 12px;border-radius:6px;color:#4e5a54;margin:2px 0;display:flex;justify-content:space-between}.nav-item.active{background:var(--green2);color:var(--green);font-weight:700}.nav-count{font-size:11px;background:#edf0ee;color:#66716b;border-radius:10px;padding:1px 7px}.nav-item.active .nav-count{background:#cfe6dc;color:#155e49}.content{padding:24px 28px 50px;min-width:0;max-width:1460px;width:100%;margin:auto}.page-head{display:flex;gap:18px;align-items:flex-start;margin-bottom:18px}.page-head h1{font-size:23px;margin:0 0 3px}.page-sub{color:var(--muted);font-size:13px}.page-actions{margin-left:auto;display:flex;gap:8px}.btn{border:1px solid #cfd6d1;background:#fff;color:#2d3933;padding:8px 13px;border-radius:6px}.btn:hover{border-color:#86a297}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.danger{color:var(--red);border-color:#e0baba}.btn:disabled{cursor:not-allowed;opacity:.45}.summary{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));background:#fff;border:1px solid var(--line);border-radius:8px;margin-bottom:18px}.stat{padding:15px 18px;border-right:1px solid var(--line)}.stat:last-child{border:0}.stat-label{color:var(--muted);font-size:12px}.stat-value{font-size:24px;font-weight:750;margin:2px 0}.stat-note{font-size:11px;color:#808a85}.urgent{color:var(--red)}
    .priority-box{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}.section-title{display:flex;align-items:center;margin-bottom:12px}.section-title h2{font-size:15px;margin:0}.section-title span{font-size:12px;color:var(--muted);margin-left:9px}.priority-list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.priority-card{border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:6px;padding:12px;background:#fff;cursor:pointer}.priority-card.red{border-left-color:var(--red)}.priority-card.green{border-left-color:var(--green)}.priority-card:hover{box-shadow:0 7px 22px #17231d10}.priority-card strong{display:block;margin-bottom:3px}.priority-card .why{color:var(--red);font-size:12px}.priority-card .next{color:var(--muted);font-size:12px;margin-top:6px}.toolbar{display:flex;gap:8px;background:#fff;padding:11px;border:1px solid var(--line);border-radius:8px 8px 0 0}.toolbar input{width:280px}.control{border:1px solid #d4dad6;border-radius:5px;background:#fff;padding:8px 10px;color:#48534d}.spacer{flex:1}.table-wrap{background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;overflow:auto}table{border-collapse:collapse;width:100%;min-width:920px}th{text-align:left;font-size:11px;color:#78827d;background:#f8f9f8;padding:10px 12px;border-bottom:1px solid var(--line)}td{padding:13px 12px;border-bottom:1px solid #edf0ee}tbody tr{cursor:pointer}tbody tr:hover{background:#f7faf8}.ticket-id{font-weight:700;color:#334b40}.main-text{font-weight:650}.sub-text{font-size:12px;color:#7b8580;margin-top:2px}.tag{display:inline-block;padding:3px 8px;border-radius:12px;font-size:11px;white-space:nowrap}.tag.green{background:var(--green2);color:var(--green)}.tag.amber{background:var(--amber2);color:var(--amber)}.tag.red{background:var(--red2);color:var(--red)}.tag.blue{background:var(--blue2);color:var(--blue)}.next-action{font-weight:650;color:var(--green)}.time-left.red{color:var(--red);font-weight:700}.time-left.amber{color:var(--amber);font-weight:700}.pager{display:flex;justify-content:space-between;padding:12px;color:var(--muted);font-size:12px}
    .drawer-backdrop{position:fixed;inset:0;background:#17231d70;z-index:10;display:none;justify-content:flex-end}.drawer-backdrop.show{display:flex}.drawer{width:min(1040px,96vw);height:100%;overflow:auto;background:#f5f6f4;box-shadow:var(--shadow)}.drawer-head{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid var(--line);padding:13px 18px;display:flex;align-items:center;gap:10px}.drawer-head h2{font-size:17px;margin:0}.drawer-head .head-actions{margin-left:auto;display:flex;gap:8px}.back{border:0;background:none;color:var(--green);padding:6px}.detail{padding:17px 20px}.notice{border:1px solid #efd0a9;background:var(--amber2);color:#704416;border-radius:6px;padding:10px 12px;margin-bottom:12px}.notice.safe{border-color:#bddbcc;background:var(--green2);color:#175d49}.detail-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:12px}.panel{background:#fff;border:1px solid var(--line);border-radius:7px;padding:15px}.panel h3{font-size:14px;margin:0 0 12px}.panel h4{font-size:12px;color:#707b75;margin:16px 0 7px}.customer-msg{font-size:15px;line-height:1.75;background:#f7f8f7;border-left:3px solid #9fb9ad;padding:11px 13px}.fact{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid #eff1ef}.fact:last-child{border:0}.fact-key{color:#7a847f}.verified{color:var(--green);font-size:11px;margin-left:5px}.missing{color:var(--red)}.decision{border:1px solid #cfe0d8;background:#f4faf7;border-radius:7px;padding:13px}.decision-title{font-size:18px;font-weight:750;color:#145a46}.decision-reason{margin-top:8px}.checklist{margin:8px 0 0;padding-left:20px}.checklist li{margin:4px 0}.policy{border-left:3px solid #7eaa97;background:#f7faf8;padding:9px 11px;margin-top:10px;font-size:12px}.policy strong{display:block;color:#355749}.reply-box{width:100%;min-height:128px;border:1px solid #d3d9d5;border-radius:6px;padding:11px;resize:vertical;line-height:1.7}.reply-status{display:flex;align-items:center;justify-content:space-between;margin-top:7px;font-size:12px;color:var(--muted)}.action-bar{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.tech-details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;color:var(--muted);font-size:12px}.tech-details summary{cursor:pointer}.tech-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.tech-chip{background:#f1f3f2;padding:7px;border-radius:4px}.full{grid-column:1/-1}
    .approval-layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(310px,.75fr);gap:14px}.approval-list,.approval-detail,.admin-card{background:#fff;border:1px solid var(--line);border-radius:8px}.approval-item{padding:14px;border-bottom:1px solid #edf0ee;cursor:pointer}.approval-item.active{background:#f1f8f5;border-left:4px solid var(--green)}.approval-item:last-child{border-bottom:0}.approval-item strong{display:block}.approval-detail{padding:18px}.amount{font-size:28px;font-weight:800}.review-grid{display:grid;grid-template-columns:120px 1fr;gap:8px;margin:14px 0}.review-label{color:var(--muted)}.risk-line{padding:9px 11px;background:var(--red2);color:#743333;border-radius:5px}.reason-select{width:100%;margin-top:8px}.admin-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.admin-card{padding:17px}.admin-card h3{font-size:15px;margin:0 0 10px}.health{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eef0ef}.health:last-child{border:0}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:7px}.technical{font-family:Consolas,monospace;font-size:12px;color:#56615c}.empty{padding:50px 20px;text-align:center;color:var(--muted)}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,14px);opacity:0;background:#1d3028;color:#fff;padding:10px 16px;border-radius:6px;transition:.2s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:1050px){.summary{grid-template-columns:repeat(3,1fr)}.stat:nth-child(3){border-right:0}.priority-list{grid-template-columns:1fr}.detail-grid,.approval-layout{grid-template-columns:1fr}.full{grid-column:auto}.admin-grid{grid-template-columns:1fr}}
    @media(max-width:720px){.shell{grid-template-columns:1fr}.side{display:none}.content{padding:17px 13px}.role-switch button{padding:5px 7px;font-size:12px}.brand small,.top-right span{display:none}.summary{grid-template-columns:repeat(2,1fr)}.stat{border-bottom:1px solid var(--line)}.toolbar{flex-wrap:wrap}.toolbar input{width:100%}.page-head{display:block}.page-actions{margin-top:10px}.tech-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="demo">交互原型 · 所有用户、订单、金额与统计均为演示数据，不代表真实生产效果</div>
  <header class="top">
    <div class="brand">售后工作台 <small>把下一步做清楚</small></div>
    <div class="role-switch" aria-label="切换原型角色">
      <button class="active" data-role="agent">客服</button>
      <button data-role="supervisor">主管</button>
      <button data-role="admin">管理</button>

    <div class="top-right"><span id="roleName">林晓雨 · 客服专员</span><div class="avatar" id="avatar">林</div></div>

  <div class="shell">
    <aside class="side" id="side"></aside>
    <main class="content">
      <section id="agentPage"></section>
      <section id="supervisorPage" class="hidden"></section>
      <section id="adminPage" class="hidden"></section>
    </main>
  </div>

  <div class="drawer-backdrop" id="backdrop"><section class="drawer"><header class="drawer-head"><button class="back" id="close">← 返回列表</button><h2 id="drawerTitle"></h2><span id="drawerStatus"></span><div class="head-actions"><button class="btn" id="transfer">转派</button><button class="btn danger" id="escalate">升级</button></div></header><div class="detail" id="drawerBody"></div></section></div>
  <div class="toast" id="toast"></div>

  <script>
    const tickets=[
      {id:'TK-0926-0186',order:'TB202609261806',customer:'陈女士',issue:'物流显示签收，但我没有收到包裹',type:'配送异常',priority:'高',status:'等待我回复',left:'18 分钟',leftClass:'red',next:'回复客户',amount:'268.00',action:'先联系承运商核实签收凭证',level:'需要人工确认',why:'签收事实与客户反馈冲突，暂不能承诺退款',reply:'陈女士您好，我们已记录您未收到包裹的情况，正在联系承运商核实签收凭证。我们会在 24 小时内向您同步结果；确认配送异常后，将按平台规则为您处理。',facts:[['订单状态','已签收'],['最新物流','9月25日 18:42 标记签收'],['收件地址','上海市浦东新区（已脱敏）'],['支付金额','¥268.00'],['承运商','中通快递'],['需要补充','签收凭证，正在查询']],policy:'配送异常处理规则 v3.2',clause:'显示签收但买家未收到时，先核验签收凭证；证据不足前不得直接认定退款责任。'},

      {id:'TK-0926-0183',order:'TB202609260992',customer:'张女士',issue:'外包装破损，担心商品也坏了',type:'商品破损',priority:'中',status:'等待客户补充',left:'客户回复后继续',leftClass:'',next:'查看待补信息',amount:'329.00',action:'请客户补充商品本体与包装内部照片',level:'信息不足',why:'现有照片只能看到外包装，无法判断商品是否损坏',reply:'张女士您好，为了尽快确认处理方式，请补充一张商品本体和包装内部的照片。收到后我们会马上为您核实，并根据商品实际情况安排换货或其他处理。',facts:[['订单状态','已签收'],['已有附件','外包装照片 1 张'],['商品本体照片','未提供'],['支付金额','¥329.00'],['签收时间','今天 09:58'],['下一步','等待客户补充照片']],policy:'运输破损处理规范 v1.8',clause:'需要根据商品本体是否损坏区分补寄包装、换货或退款。'},
      {id:'TK-0926-0182',order:'TB202609260821',customer:'赵先生',issue:'满199减30为什么没有生效',type:'优惠咨询',priority:'低',status:'已完成',left:'—',leftClass:'',next:'查看记录',amount:'219.00',action:'解释活动排除商品和有效参与金额',level:'可以直接处理',why:'特价商品40元不参与活动，有效金额为179元',reply:'赵先生您好，本单有一件40元特价商品不参与满减。扣除后，参与活动的商品金额为179元，未达到199元门槛，因此满减没有生效。',facts:[['商品总额','¥219.00'],['排除商品','特价收纳盒 ¥40.00'],['活动有效金额','¥179.00'],['活动门槛','¥199.00'],['处理状态','已向客户解释'],['客户反馈','已理解']],policy:'店铺满减活动说明 MZ-2026-41',clause:'特价商品不计入满减门槛，优惠不与专属券叠加。'}

    function toast(msg){const el=qs('#toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}
    function setSide(){const html={agent:`<div class="side-title">我的工作</div><button class="nav-item active">我的待办 <span class="nav-count">12</span></button><button class="nav-item">全部工单</button><button class="nav-item">等待客户 <span class="nav-count">3</span></button><button class="nav-item">已完成</button><div class="side-title" style="margin-top:25px">帮助处理</div><button class="nav-item">政策查询</button><button class="nav-item">常用回复</button>`,supervisor:`<div class="side-title">主管工作</div><button class="nav-item active">待我审批 <span class="nav-count">3</span></button><button class="nav-item">升级工单 <span class="nav-count">2</span></button><button class="nav-item">团队待办</button><button class="nav-item">处理质量</button><div class="side-title" style="margin-top:25px">规则</div><button class="nav-item">政策查询</button>`,admin:`<div class="side-title">业务管理</div><button class="nav-item active">系统概况</button><button class="nav-item">业务接口</button><button class="nav-item">政策版本</button><button class="nav-item">用户与权限</button><div class="side-title" style="margin-top:25px">技术管理</div><button class="nav-item">模型与评测</button><button class="nav-item">运行记录</button><button class="nav-item">审计日志</button>`}[role];qs('#side').innerHTML=html}
    function renderAgent(){qs('#agentPage').innerHTML=`<div class="page-head"><div><h1>我的待办</h1><div class="page-sub">先处理即将超时和等待回复的工单</div></div><div class="page-actions"><button class="btn">政策查询</button><button class="btn primary" id="newTicket">新建工单</button></div></div><section class="summary"><div class="stat"><div class="stat-label">即将超时</div><div class="stat-value urgent">2</div><div class="stat-note">请优先处理</div></div><div class="stat"><div class="stat-label">等待我回复</div><div class="stat-value">5</div><div class="stat-note">事实已经齐全</div></div><div class="stat"><div class="stat-label">等待客户补充</div><div class="stat-value">3</div><div class="stat-note">无需反复查看</div></div><div class="stat"><div class="stat-label">待主管审批</div><div class="stat-value">2</div><div class="stat-note">审批后自动提醒</div></div><div class="stat"><div class="stat-label">今日已完成</div><div class="stat-value">18</div><div class="stat-note">演示统计</div></div></section><section class="priority-box"><div class="section-title"><h2>现在优先处理</h2><span>按超时风险和客户等待时间排序</span></div><div class="priority-list">${tickets.slice(0,3).map((t,i)=>`<article class="priority-card ${i===0?'red':i===2?'green':''}" data-ticket="${t.id}"><strong>${t.issue}</strong><div>${t.customer} · ${t.id}</div><div class="why">${i===0?'还有18分钟超时':i===1?'内部核实已等待46分钟':'事实齐全，可立即回复'}</div><div class="next">下一步：${t.next} →</div></article>`).join('')}</div></section><div class="toolbar"><input class="control" id="search" placeholder="搜索工单号、订单号或客户问题"><select class="control"><option>全部状态</option><option>等待我回复</option><option>等待客户补充</option><option>等待审批</option></select><select class="control"><option>全部问题</option><option>退款退货</option><option>配送异常</option><option>少件漏发</option></select><div class="spacer"></div><button class="btn">重置</button></div><div class="table-wrap"><table><thead><tr><th>工单</th><th>客户问题</th><th>当前状态</th><th>剩余时限</th><th>下一步</th></tr></thead><tbody id="ticketRows"></tbody></table><div class="pager"><span>演示数据 · 共5条</span><span>第1页</span></div></div>`;renderRows();qs('#newTicket').onclick=()=>toast('原型演示：新建工单只需录入订单号和客户问题');document.querySelectorAll('[data-ticket]').forEach(el=>el.onclick=()=>openTicket(el.dataset.ticket));qs('#search').oninput=renderRows}
    function renderRows(){const q=(qs('#search')?.value||'').toLowerCase();const rows=tickets.filter(t=>[t.id,t.order,t.customer,t.issue].join(' ').toLowerCase().includes(q));qs('#ticketRows').innerHTML=rows.map(t=>`<tr data-id="${t.id}"><td><div class="ticket-id">${t.id}</div><div class="sub-text">${t.order}</div></td><td><div class="main-text">${t.issue}</div><div class="sub-text">${t.customer} · ${t.type}</div></td><td><span class="tag ${t.status==='已完成'?'green':t.status.includes('补充')?'blue':t.status.includes('核实')?'amber':'green'}">${t.status}</span></td><td><span class="time-left ${t.leftClass}">${t.left}</span></td><td class="next-action">${t.next} →</td></tr>`).join('');document.querySelectorAll('#ticketRows tr').forEach(row=>row.onclick=()=>openTicket(row.dataset.id))}
    function openTicket(id){currentTicket=tickets.find(t=>t.id===id);const t=currentTicket;qs('#drawerTitle').textContent=`${t.id} · ${t.customer}`;qs('#drawerStatus').innerHTML=`<span class="tag ${t.level==='可以直接处理'?'green':t.level==='信息不足'?'blue':'amber'}">${t.level}</span>`;const canSend=t.level==='可以直接处理';const isPending=v=>v.includes('未提供')||v.includes('查询中')||v.includes('正在查询')||v.includes('等待');qs('#drawerBody').innerHTML=`<div class="notice ${canSend?'safe':''}"><strong>${canSend?'可以继续处理':'当前不能直接承诺处理结果'}</strong>　${t.why}</div><div class="detail-grid"><section class="panel"><h3>1. 客户遇到什么问题</h3><div class="customer-msg">${t.issue}</div><h4>客户与订单</h4><div class="fact"><span class="fact-key">客户</span><span>${t.customer}</span></div><div class="fact"><span class="fact-key">订单号</span><span>${t.order}</span></div><div class="fact"><span class="fact-key">问题类型</span><span>${t.type}</span></div><h3 style="margin-top:20px">2. 已经核实的事实</h3>${t.facts.map(([k,v])=>`<div class="fact"><span class="fact-key">${k}</span><span class="${isPending(v)?'missing':''}">${v}${isPending(v)?'<span class="missing"> · 待确认</span>':'<span class="verified">已核实</span>'}</span></div>`).join('')}</section><section class="panel"><h3>3. 建议怎么处理</h3><div class="decision"><div class="decision-title">${t.action}</div><div class="decision-reason">为什么：${t.why}</div><ul class="checklist"><li>先确认页面中的关键事实</li><li>${canSend?'可使用下方草稿回复客户':'等待缺失事实或主管确认后再执行'}</li><li>如客户补充新情况，重新评估处理方式</li></ul></div><div class="policy"><strong>业务依据 · ${t.policy}</strong>${t.clause}<div style="margin-top:6px;color:var(--green)">查看适用条件和政策原文 →</div></div><h3 style="margin-top:20px">4. 回复客户并完成工单</h3><textarea class="reply-box" id="replyText">${t.reply}</textarea><div class="reply-status"><span>${canSend?'草稿可以发送，发送前请再次确认':'草稿不会承诺未批准的退款或赔付'}</span><span>已保存</span></div><div class="action-bar"><button class="btn">保存草稿</button><button class="btn" id="copyReply">复制</button><button class="btn primary" id="mainAction">${canSend?'确认并发送':'提交人工确认'}</button></div></section><details class="tech-details full"><summary>技术详情（仅用于排障，客服平时无需查看）</summary><div class="tech-grid"><div class="tech-chip">运行编号：demo-${t.id}</div><div class="tech-chip">事实更新时间：刚刚</div><div class="tech-chip">规则版本：after-sales-v2</div></div></details></div>`;qs('#backdrop').classList.add('show');qs('#copyReply').onclick=()=>toast('回复草稿已复制（原型演示）');qs('#mainAction').onclick=()=>toast(canSend?'回复已发送并记录（原型演示）':'已提交主管或相关人员确认（原型演示）')}
    function renderSupervisor(){const a=approvals[selectedApproval];qs('#supervisorPage').innerHTML=`<div class="page-head"><div><h1>待我审批</h1><div class="page-sub">只处理需要承担金额、责任或争议风险的工单</div></div></div><div class="approval-layout"><section class="approval-list">${approvals.map((x,i)=>`<article class="approval-item ${i===selectedApproval?'active':''}" data-approval="${i}"><strong>${x.action} · ¥${x.amount}</strong><div>${x.customer} · ${x.ticket}</div><div class="sub-text">${x.risk}</div></article>`).join('')}</section><section class="approval-detail"><span class="tag red">需要主管决定</span><h2>${a.action}</h2><div class="amount">¥${a.amount}</div><div class="review-grid"><span class="review-label">工单</span><strong>${a.ticket}</strong><span class="review-label">客户</span><span>${a.customer}</span><span class="review-label">关键事实</span><span>${a.facts}</span><span class="review-label">政策依据</span><span>${a.policy}</span></div><div class="risk-line"><strong>为什么需要审批：</strong>${a.risk}</div><h3>准备回复客户</h3><textarea class="reply-box">${a.reply}</textarea><select class="control reason-select" id="rejectReason"><option value="">驳回时选择原因</option><option>事实不足，需要继续核实</option><option>政策不适用</option><option>金额不正确</option><option>回复措辞需要修改</option></select><div class="action-bar"><button class="btn danger" id="reject">驳回并说明</button><button class="btn" id="editApprove">修改后批准</button><button class="btn primary" id="approve">批准</button></div></section></div>`;document.querySelectorAll('[data-approval]').forEach(el=>el.onclick=()=>{selectedApproval=Number(el.dataset.approval);renderSupervisor()});qs('#approve').onclick=()=>toast('审批已记录，客服将收到结果（原型演示）');qs('#editApprove').onclick=()=>toast('修改内容已保存并批准（原型演示）');qs('#reject').onclick=()=>toast(qs('#rejectReason').value?'已驳回并将原因返回客服':'请先选择驳回原因')}
    function renderAdmin(){qs('#adminPage').innerHTML=`<div class="page-head"><div><h1>系统管理</h1><div class="page-sub">技术信息集中在管理后台，不干扰客服工作</div></div><div class="page-actions"><button class="btn">查看审计日志</button></div></div><div class="admin-grid"><section class="admin-card"><h3>业务接口</h3><div class="health"><span><i class="dot"></i>订单查询</span><span class="tag green">可用</span></div><div class="health"><span><i class="dot"></i>物流查询</span><span class="tag amber">演示适配器</span></div><div class="health"><span><i class="dot"></i>退款执行</span><span class="tag red">未接入</span></div><div class="health"><span><i class="dot"></i>客服消息</span><span class="tag red">未接入</span></div></section><section class="admin-card"><h3>政策与业务规则</h3><div class="health"><span>当前生效政策</span><strong>12</strong></div><div class="health"><span>30天内即将失效</span><strong>2</strong></div><div class="health"><span>存在冲突待处理</span><strong class="urgent">1</strong></div><div class="health"><span>最近更新时间</span><span>今天 09:40</span></div></section><section class="admin-card"><h3>模型与评测</h3><p>这些指标用于技术人员判断系统质量，不展示给客服。</p><div class="technical">运行模式：stub（演示）<br>真实模型基线：尚未完成<br>独立真实工单评测：尚未完成<br>建议动作与政策一致性：待新增门禁</div><div class="action-bar"><button class="btn">打开技术评测</button></div></section><section class="admin-card"><h3>交付准备度</h3><div class="health"><span>本地工程</span><span class="tag green">已完成</span></div><div class="health"><span>角色化界面</span><span class="tag amber">待改造</span></div><div class="health"><span>真实接口</span><span class="tag red">未验收</span></div><div class="health"><span>真实客服试点</span><span class="tag red">未开始</span></div></section></div>`}
    function switchRole(next){role=next;document.querySelectorAll('[data-role]').forEach(b=>b.classList.toggle('active',b.dataset.role===role));qs('#agentPage').classList.toggle('hidden',role!=='agent');qs('#supervisorPage').classList.toggle('hidden',role!=='supervisor');qs('#adminPage').classList.toggle('hidden',role!=='admin');const meta={agent:['林晓雨 · 客服专员','林'],supervisor:['王主管 · 售后主管','王'],admin:['系统管理员','管']}[role];qs('#roleName').textContent=meta[0];qs('#avatar').textContent=meta[1];setSide();if(role==='agent')renderAgent();if(role==='supervisor')renderSupervisor();if(role==='admin')renderAdmin()}
    document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>switchRole(b.dataset.role));qs('#close').onclick=()=>qs('#backdrop').classList.remove('show');qs('#backdrop').onclick=e=>{if(e.target===qs('#backdrop'))qs('#backdrop').classList.remove('show')};qs('#transfer').onclick=()=>toast('请选择接手人并填写转派原因（原型演示）');qs('#escalate').onclick=()=>toast('已升级给售后主管（原型演示）');switchRole('agent');
  </script>
</body>
</html>
