# =============================================================================
# pytest 配置（backend/pytest.ini）
# 在本文件所在目录（backend/）执行：python -m pytest
# 也可用统一入口：scripts\dev.ps1 test  /  scripts/dev.sh test
# =============================================================================
[pytest]
# 测试目录：单元 / 集成 / 评测（见设计文档 14 节目录结构）
testpaths = tests

# 让 `import app.xxx` 直接可用（等价于 PYTHONPATH=backend）
pythonpath = .

# 默认安静输出；需要详细日志时追加 -v / --log-cli-level=INFO
addopts = -q

# 无匹配测试目录时给出更明确的行为（避免 pytest 退回到全仓库扫描）
norecursedirs = .venv venv __pycache__ .git data .tmp

# 自定义标记：`slow` 表示"真实跑完整工作流/全量评测"的慢用例
# 只跑快速回归：pytest -m "not slow"
markers =
    slow: 真实执行工作流或全量评测的慢用例（默认仍会被执行，可用 -m "not slow" 跳过）

# 测试为同步用例（fastapi.testclient + 线程内执行），
# 因此不配置 asyncio_mode，也不要求 pytest-asyncio 生效。
# 过滤第三方库在 Python 3.12 下的弃用告警噪音：
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning
    # passlib / jwt 等库的内部告警
    ignore:.*passlib.*:UserWarning
    # 无 event loop 环境下 coroutine 未 await 的提示（同步测试场景）
    ignore::RuntimeWarning
